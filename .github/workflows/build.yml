name: Build Executables

on:
  push:
    branches:
      - "qt6"
  pull_request:
    branches:
      - "qt6"

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install VLC
        run: choco install vlc -y

      - name: Verify VLC Installation Path
        shell: powershell
        run: |
          if (!(Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll")) { Write-Error "libvlc.dll nicht gefunden."; exit 1 }
          if (!(Test-Path "C:\Program Files\VideoLAN\VLC\libvlccore.dll")) { Write-Error "libvlccore.dll nicht gefunden."; exit 1 }
          if (!(Test-Path "C:\Program Files\VideoLAN\VLC\plugins")) { Write-Error "VLC Plugins nicht gefunden."; exit 1 }
          Write-Output "VLC ok."

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        shell: powershell
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        shell: powershell
        run: |
          $PUBLIC_SUFFIX_PATH = python -c "import whois, os; print(os.path.join(os.path.dirname(whois.__file__), 'data', 'public_suffix_list.dat'))"
          "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify public_suffix_list.dat Exists
        shell: powershell
        run: |
          if (!(Test-Path $env:PUBLIC_SUFFIX_PATH)) { Write-Error "public_suffix_list.dat nicht gefunden: $env:PUBLIC_SUFFIX_PATH"; exit 1 }
          Write-Output "public_suffix_list.dat ok."

      - name: Create runtime hook for VLC (Windows)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path hooks | Out-Null
          @'
          import os, sys, tempfile

          base = getattr(sys, "_MEIPASS", os.path.dirname(os.path.abspath(__file__)))
          plugins_dir = os.path.join(base, "plugins")

          # Plugin path
          if os.path.isdir(plugins_dir):
              os.environ["VLC_PLUGIN_PATH"] = plugins_dir

          # Put VLC cache somewhere writable (helps in onefile)
          cache_dir = os.path.join(tempfile.gettempdir(), "vlc-cache")
          os.makedirs(cache_dir, exist_ok=True)
          os.environ["APPDATA"] = cache_dir
          '@ | Set-Content -Encoding UTF8 hooks/hook-vlc.py

      # -------------------------
      # WINDOWS: ONEFILE (TEST)
      # -------------------------
      - name: Build (Windows) - ONEFILE
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist)  { Remove-Item -Recurse -Force dist }

          pyinstaller --onefile --windowed `
            --name "TMP-Networks-Browser-Mini-onefile" `
            --icon=assets/logo.ico `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlc.dll;." `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlccore.dll;." `
            --add-data "C:\Program Files\VideoLAN\VLC\plugins;plugins" `
            --add-data "$env:PUBLIC_SUFFIX_PATH;whois\data" `
            --runtime-hook hooks/hook-vlc.py `
            TMP-Networks-Browser-Mini.py

          # remove plugin cache (paths often wrong in bundle)
          if (Test-Path "dist\plugins\plugins.dat") { Remove-Item -Force "dist\plugins\plugins.dat" }

          Get-ChildItem -Recurse dist

      - name: Upload Artifact (Windows ONEFILE)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-Windows-ONEFILE"
          path: "dist/TMP-Networks-Browser-Mini-onefile.exe"
          if-no-files-found: "warn"

      # -------------------------
      # WINDOWS: ONEDIR (FALLBACK)
      # -------------------------
      - name: Build (Windows) - ONEDIR
        shell: powershell
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist)  { Remove-Item -Recurse -Force dist }

          pyinstaller --onedir --windowed `
            --name "TMP-Networks-Browser-Mini-onedir" `
            --icon=assets/logo.ico `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlc.dll;." `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlccore.dll;." `
            --add-data "C:\Program Files\VideoLAN\VLC\plugins;plugins" `
            --add-data "$env:PUBLIC_SUFFIX_PATH;whois\data" `
            --runtime-hook hooks/hook-vlc.py `
            TMP-Networks-Browser-Mini.py

          # remove plugin cache
          if (Test-Path "dist\TMP-Networks-Browser-Mini-onedir\plugins\plugins.dat") {
            Remove-Item -Force "dist\TMP-Networks-Browser-Mini-onedir\plugins\plugins.dat"
          }

          Get-ChildItem -Recurse dist

      - name: Upload Artifact (Windows ONEDIR)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-Windows-ONEDIR"
          path: "dist/TMP-Networks-Browser-Mini-onedir"
          if-no-files-found: "warn"

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Icon File Exists
        run: |
          test -f assets/logo.icns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install VLC
        run: brew install --cask vlc

      - name: Verify VLC Libraries on macOS
        run: |
          VLC_LIB_DIR="/Applications/VLC.app/Contents/MacOS/lib"
          test -f "$VLC_LIB_DIR/libvlc.dylib"
          test -f "$VLC_LIB_DIR/libvlccore.dylib"
          test -d "/Applications/VLC.app/Contents/MacOS/plugins"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        run: |
          PUBLIC_SUFFIX_PATH="$(python -c 'import whois, os; print(os.path.join(os.path.dirname(whois.__file__), "data", "public_suffix_list.dat"))')"
          echo "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" >> "$GITHUB_ENV"

      - name: Create runtime hook for VLC (macOS)
        run: |
          mkdir -p hooks
          cat > hooks/hook-vlc.py <<'PY'
          import os, sys, tempfile

          base = getattr(sys, "_MEIPASS", os.path.dirname(os.path.abspath(__file__)))
          lib_dir = os.path.join(base, "lib")
          plugins_dir = os.path.join(base, "plugins")

          if os.path.isdir(lib_dir):
              os.environ["DYLD_LIBRARY_PATH"] = lib_dir + ":" + os.environ.get("DYLD_LIBRARY_PATH", "")

          if os.path.isdir(plugins_dir):
              os.environ["VLC_PLUGIN_PATH"] = plugins_dir
              os.environ["VLC_DATA_PATH"] = base

          cache_dir = os.path.join(tempfile.gettempdir(), "vlc-cache")
          os.makedirs(cache_dir, exist_ok=True)
          os.environ["XDG_CACHE_HOME"] = cache_dir
          PY

      # -------------------------
      # MACOS: ONEFILE (TEST)
      # -------------------------
      - name: Build (macOS) - ONEFILE
        run: |
          rm -rf build dist
          test -f "$PUBLIC_SUFFIX_PATH"

          pyinstaller --onefile --windowed \
            --name "TMP-Networks-Browser-Mini-onefile" \
            --icon=assets/logo.icns \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib:lib" \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib:lib" \
            --add-data "/Applications/VLC.app/Contents/MacOS/plugins:plugins" \
            --add-data "$PUBLIC_SUFFIX_PATH:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

          # remove plugin cache
          find dist -path "*plugins/plugins.dat" -delete || true

          ls -R dist

      - name: Upload Artifact (macOS ONEFILE)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-macOS-ONEFILE"
          path: "dist/TMP-Networks-Browser-Mini-onefile"
          if-no-files-found: "warn"

      # -------------------------
      # MACOS: ONEDIR (FALLBACK) + ZIP
      # -------------------------
      - name: Build (macOS) - ONEDIR
        run: |
          rm -rf build dist
          test -f "$PUBLIC_SUFFIX_PATH"

          pyinstaller --onedir --windowed \
            --name "TMP-Networks-Browser-Mini-onedir" \
            --icon=assets/logo.icns \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib:lib" \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib:lib" \
            --add-data "/Applications/VLC.app/Contents/MacOS/plugins:plugins" \
            --add-data "$PUBLIC_SUFFIX_PATH:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

          find dist -path "*plugins/plugins.dat" -delete || true

          cd dist
          ditto -c -k --sequesterRsrc --keepParent "TMP-Networks-Browser-Mini-onedir.app" "TMP-Networks-Browser-Mini-onedir-macOS.zip"

      - name: Upload Artifact (macOS ONEDIR)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-macOS-ONEDIR"
          path: "dist/TMP-Networks-Browser-Mini-onedir-macOS.zip"
          if-no-files-found: "warn"

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: "~/.cache/pip"
          key: "${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install VLC and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libvlc-dev build-essential pkg-config \
            libxcb-cursor0 libx11-xcb1 libxrender1 libxkbcommon-x11-0 libxcb1 \
            libxcb-util1 libxext6 libxfixes3 libxi6 libxrandr2 libxss1 libxtst6

      - name: Verify VLC Installation
        run: |
          LIBVLC_PATH="$(ldconfig -p | grep 'libvlc\.so' | head -n 1 | awk '{print $4}')"
          test -f "$LIBVLC_PATH"

          LIBVLCCORE_PATH="$(ldconfig -p | grep 'libvlccore\.so' | head -n 1 | awk '{print $4}')"
          test -f "$LIBVLCCORE_PATH"

          if [ -d "/usr/lib/vlc/plugins" ] && [ -f "/usr/lib/vlc/plugins/plugins.dat" ]; then
            PLUGINS_PATH="/usr/lib/vlc/plugins"
          elif [ -d "/usr/lib/x86_64-linux-gnu/vlc/plugins" ] && [ -f "/usr/lib/x86_64-linux-gnu/vlc/plugins/plugins.dat" ]; then
            PLUGINS_PATH="/usr/lib/x86_64-linux-gnu/vlc/plugins"
          else
            echo "VLC Plugins nicht gefunden."
            exit 1
          fi

          echo "LIBVLC_PATH=$LIBVLC_PATH" >> "$GITHUB_ENV"
          echo "LIBVLCCORE_PATH=$LIBVLCCORE_PATH" >> "$GITHUB_ENV"
          echo "PLUGINS_PATH=$PLUGINS_PATH" >> "$GITHUB_ENV"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        run: |
          PUBLIC_SUFFIX_PATH="$(python -c 'import whois, os; print(os.path.join(os.path.dirname(whois.__file__), "data", "public_suffix_list.dat"))')"
          echo "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" >> "$GITHUB_ENV"

      - name: Verify public_suffix_list.dat Exists
        run: |
          test -f "$PUBLIC_SUFFIX_PATH"

      - name: Create runtime hook for VLC (Linux)
        run: |
          mkdir -p hooks
          cat > hooks/hook-vlc.py <<'PY'
          import os, sys, tempfile

          base = getattr(sys, "_MEIPASS", os.path.dirname(os.path.abspath(__file__)))
          lib_dir = os.path.join(base, "lib")
          plugins_dir = os.path.join(base, "plugins")

          if os.path.isdir(lib_dir):
              os.environ["LD_LIBRARY_PATH"] = lib_dir + ":" + os.environ.get("LD_LIBRARY_PATH", "")

          if os.path.isdir(plugins_dir):
              os.environ["VLC_PLUGIN_PATH"] = plugins_dir
              os.environ["VLC_DATA_PATH"] = base

          cache_dir = os.path.join(tempfile.gettempdir(), "vlc-cache")
          os.makedirs(cache_dir, exist_ok=True)
          os.environ["XDG_CACHE_HOME"] = cache_dir
          PY

      # -------------------------
      # LINUX: ONEFILE (TEST)
      # -------------------------
      - name: Build (Linux) - ONEFILE
        run: |
          rm -rf build dist

          pyinstaller --onefile --windowed \
            --name "TMP-Networks-Browser-Mini-onefile" \
            --icon=assets/logo.png \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "${LIBVLC_PATH}:lib" \
            --add-binary "${LIBVLCCORE_PATH}:lib" \
            --add-data "${PLUGINS_PATH}:plugins" \
            --add-data "${PUBLIC_SUFFIX_PATH}:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

          # remove plugin cache (very important)
          find dist -path "*plugins/plugins.dat" -delete || true

          ls -R dist

      - name: Upload Artifact (Linux ONEFILE)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-Linux-ONEFILE"
          path: "dist/TMP-Networks-Browser-Mini-onefile"
          if-no-files-found: "warn"

      # -------------------------
      # LINUX: ONEDIR (FALLBACK)
      # -------------------------
      - name: Build (Linux) - ONEDIR
        run: |
          rm -rf build dist

          pyinstaller --onedir --windowed \
            --name "TMP-Networks-Browser-Mini-onedir" \
            --icon=assets/logo.png \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "${LIBVLC_PATH}:lib" \
            --add-binary "${LIBVLCCORE_PATH}:lib" \
            --add-data "${PLUGINS_PATH}:plugins" \
            --add-data "${PUBLIC_SUFFIX_PATH}:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

          find dist -path "*plugins/plugins.dat" -delete || true

          ls -R dist

      - name: Upload Artifact (Linux ONEDIR)
        uses: actions/upload-artifact@v4
        with:
          name: "TMP-Networks-Browser-Mini-Linux-ONEDIR"
          path: "dist/TMP-Networks-Browser-Mini-onedir"
          if-no-files-found: "warn"
