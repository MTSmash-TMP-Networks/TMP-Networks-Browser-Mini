name: Build Executables

on:
  push:
    branches:
      - qt6
  pull_request:
    branches:
      - qt6

jobs:
  # ------------------------------
  # 1) BUILD ON WINDOWS
  # ------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install VLC
        run: choco install vlc -y

      - name: Verify VLC Installation Path
        shell: powershell
        run: |
          if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll") {
            Write-Output "libvlc.dll gefunden."
          } else {
            Write-Error "libvlc.dll nicht gefunden."
            exit 1
          }

          if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlccore.dll") {
            Write-Output "libvlccore.dll gefunden."
          } else {
            Write-Error "libvlccore.dll nicht gefunden."
            exit 1
          }

          if (Test-Path "C:\Program Files\VideoLAN\VLC\plugins") {
            Write-Output "VLC Plugins gefunden."
          } else {
            Write-Error "VLC Plugins nicht gefunden."
            exit 1
          }

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        id: find_public_suffix
        shell: powershell
        run: |
          $PUBLIC_SUFFIX_PATH = python -c "import whois, os; print(os.path.join(os.path.dirname(whois.__file__), 'data', 'public_suffix_list.dat'))"
          Write-Output "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify public_suffix_list.dat Exists
        shell: powershell
        run: |
          if (!(Test-Path $env:PUBLIC_SUFFIX_PATH)) {
            Write-Error "public_suffix_list.dat nicht gefunden unter $env:PUBLIC_SUFFIX_PATH"
            exit 1
          } else {
            Write-Output "public_suffix_list.dat gefunden."
          }

      - name: Display Python Version
        run: python --version

      - name: List Installed Packages
        run: pip list

      - name: Display Environment Variables
        shell: powershell
        run: |
          Write-Output "Umgebungsvariablen:"
          Get-ChildItem Env:

      - name: Build EXE
        shell: powershell
        run: |
          # Bereinige vorherige Builds
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist)  { Remove-Item -Recurse -Force dist }

          pyinstaller --onefile --windowed `
            --icon=assets/logo.ico `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlc.dll;." `
            --add-binary "C:\Program Files\VideoLAN\VLC\libvlccore.dll;." `
            --add-data "C:\Program Files\VideoLAN\VLC\plugins;plugins" `
            --add-data "$env:PUBLIC_SUFFIX_PATH;whois\data" `
            TMP-Networks-Browser-Mini.py

          # Überprüfe den Inhalt von dist/
          Write-Output "Inhalt von dist/:"
          Get-ChildItem -Recurse dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TMP-Networks-Browser-Mini-Windows-Executable
          path: dist\TMP-Networks-Browser-Mini.exe
          if-no-files-found: warn
          include-hidden-files: false

  # ------------------------------
  # 2) BUILD ON macOS
  # ------------------------------
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Icon File Exists
        run: |
          if [ ! -f assets/logo.icns ]; then
            echo "Error: assets/logo.icns not found!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install VLC
        run: brew install --cask vlc

      - name: Verify VLC Libraries on macOS
        run: |
          VLC_LIB_DIR="/Applications/VLC.app/Contents/MacOS/lib"
          if [ ! -f "$VLC_LIB_DIR/libvlc.dylib" ]; then
            echo "Error: libvlc.dylib not found in $VLC_LIB_DIR"
            exit 1
          fi

          if [ ! -f "$VLC_LIB_DIR/libvlccore.dylib" ]; then
            echo "Error: libvlccore.dylib not found in $VLC_LIB_DIR"
            exit 1
          fi

          if [ ! -d "/Applications/VLC.app/Contents/MacOS/plugins" ]; then
            echo "Error: VLC plugins directory not found."
            exit 1
          fi

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        id: find_public_suffix
        run: |
          PUBLIC_SUFFIX_PATH=$(python -c "import whois, os; print(os.path.join(os.path.dirname(whois.__file__), 'data', 'public_suffix_list.dat'))")
          echo "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" >> $GITHUB_ENV

      - name: Build macOS App
        run: |
          # Entferne vorherige Builds
          rm -rf build dist

          # Überprüfen, ob die Datei existiert
          if [ ! -f "$PUBLIC_SUFFIX_PATH" ]; then
            echo "Error: public_suffix_list.dat nicht gefunden unter $PUBLIC_SUFFIX_PATH"
            exit 1
          fi

          # Erstelle Runtime Hook für VLC
          mkdir -p hooks
          echo "import os, sys" > hooks/hook-vlc.py
          echo "def set_ld_library_path():" >> hooks/hook-vlc.py
          echo "    base_path = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))" >> hooks/hook-vlc.py
          echo "    vlc_lib_path = os.path.join(base_path, 'lib')" >> hooks/hook-vlc.py
          echo "    if os.path.exists(vlc_lib_path):" >> hooks/hook-vlc.py
          echo "        os.environ['DYLD_LIBRARY_PATH'] = vlc_lib_path + ':' + os.environ.get('DYLD_LIBRARY_PATH', '')" >> hooks/hook-vlc.py
          echo "set_ld_library_path()" >> hooks/hook-vlc.py

          pyinstaller --windowed \
            --icon=assets/logo.icns \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib:lib" \
            --add-binary "/Applications/VLC.app/Contents/MacOS/lib/libvlccore.dylib:lib" \
            --add-data "/Applications/VLC.app/Contents/MacOS/plugins:plugins" \
            --add-data "$PUBLIC_SUFFIX_PATH:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

      - name: List dist Directory
        run: |
          echo "Inhalt von dist/:"
          ls -la dist/

      - name: Check Write Permissions
        run: |
          echo "Überprüfe Schreibrechte im Application Support-Verzeichnis:"
          python -c "import appdirs, os; dirs = appdirs.AppDirs('TMPNetworksBrowserMini', 'MTSmash'); print(dirs.user_data_dir)"
          python -c "import appdirs, os; dirs = appdirs.AppDirs('TMPNetworksBrowserMini', 'MTSmash'); os.makedirs(dirs.user_data_dir, exist_ok=True); open(os.path.join(dirs.user_data_dir, 'test_write.txt'), 'w').close()"

      - name: Compress .app for Artifact
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "TMP-Networks-Browser-Mini.app" \
                "TMP-Networks-Browser-Mini-macOS.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TMP-Networks-Browser-Mini-macOS
          path: dist/TMP-Networks-Browser-Mini-macOS.zip
          if-no-files-found: warn

  # ------------------------------
  # 3) BUILD ON LINUX
  # ------------------------------
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install VLC and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libvlc-dev build-essential pkg-config \
            libxcb-cursor0 libx11-xcb1 libxrender1 libxkbcommon-x11-0 libxcb1 \
            libxcb-util1 libxext6 libxfixes3 libxi6 libxrandr2 libxss1 libxtst6

      - name: Verify VLC Installation
        run: |
          # Überprüfen von libvlc.so
          LIBVLC_PATH=$(ldconfig -p | grep libvlc.so | head -n 1 | awk '{print $4}')
          if [ -f "$LIBVLC_PATH" ]; then
            echo "libvlc.so gefunden unter $LIBVLC_PATH."
          else
            echo "libvlc.so nicht gefunden."
            exit 1
          fi

          # Überprüfen von libvlccore.so
          LIBVLCCORE_PATH=$(ldconfig -p | grep libvlccore.so | head -n 1 | awk '{print $4}')
          if [ -f "$LIBVLCCORE_PATH" ]; then
            echo "libvlccore.so gefunden unter $LIBVLCCORE_PATH."
          else
            echo "libvlccore.so nicht gefunden."
            exit 1
          fi

          # Bestimmen des Plugins-Pfads
          PLUGINS_PATH=$(dirname "$LIBVLC_PATH")/vlc/plugins
          if [ -d "$PLUGINS_PATH" ]; then
            echo "VLC Plugins gefunden unter $PLUGINS_PATH."
          else
            # Fallback-Pfade prüfen
            if [ -d "/usr/lib/vlc/plugins" ]; then
              PLUGINS_PATH="/usr/lib/vlc/plugins"
              echo "VLC Plugins gefunden unter $PLUGINS_PATH."
            elif [ -d "/usr/lib/x86_64-linux-gnu/vlc/plugins" ]; then
              PLUGINS_PATH="/usr/lib/x86_64-linux-gnu/vlc/plugins"
              echo "VLC Plugins gefunden unter $PLUGINS_PATH."
            else
              echo "VLC Plugins nicht gefunden unter den erwarteten Verzeichnissen."
              exit 1
            fi
          fi

          # Exportieren der Pfade als Umgebungsvariablen
          echo "LIBVLC_PATH=$LIBVLC_PATH" >> $GITHUB_ENV
          echo "LIBVLCCORE_PATH=$LIBVLCCORE_PATH" >> $GITHUB_ENV
          echo "PLUGINS_PATH=$PLUGINS_PATH" >> $GITHUB_ENV

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller appdirs

      - name: Install yt-dlp Nightly Version
        run: |
          python -m pip install -U --pre "yt-dlp[default]"

      - name: Find public_suffix_list.dat
        id: find_public_suffix
        run: |
          PUBLIC_SUFFIX_PATH=$(python -c "import whois, os; print(os.path.join(os.path.dirname(whois.__file__), 'data', 'public_suffix_list.dat'))")
          echo "PUBLIC_SUFFIX_PATH=$PUBLIC_SUFFIX_PATH" >> $GITHUB_ENV

      - name: Verify public_suffix_list.dat Exists
        run: |
          if [ ! -f "$PUBLIC_SUFFIX_PATH" ]; then
            echo "public_suffix_list.dat nicht gefunden unter $PUBLIC_SUFFIX_PATH"
            exit 1
          else
            echo "public_suffix_list.dat gefunden."
          fi

      - name: Create runtime hook for VLC
        run: |
          mkdir -p hooks
          cat <<EOF > hooks/hook-vlc.py
import os, sys

def set_ld_library_path():
    base_path = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
    vlc_lib_path = os.path.join(base_path, 'lib')
    if os.path.exists(vlc_lib_path):
        os.environ['LD_LIBRARY_PATH'] = vlc_lib_path + ':' + os.environ.get('LD_LIBRARY_PATH', '')
        print(f"Set LD_LIBRARY_PATH to: {os.environ['LD_LIBRARY_PATH']}")
    else:
        print("VLC lib path not found.")

set_ld_library_path()
EOF

      - name: Build Executable
        run: |
          # Lösche alte Builds
          rm -rf build dist

          pyinstaller --onefile \
            --windowed \
            --icon=assets/logo.png \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --add-binary "$LIBVLC_PATH:lib" \
            --add-binary "$LIBVLCCORE_PATH:lib" \
            --add-data "$PLUGINS_PATH:plugins" \
            --add-data "$PUBLIC_SUFFIX_PATH:whois/data" \
            --runtime-hook hooks/hook-vlc.py \
            TMP-Networks-Browser-Mini.py

          echo "Inhalt von dist/:"
          ls -R dist/

      - name: Check Library Dependencies
        run: |
          ldd dist/TMP-Networks-Browser-Mini
          find dist -name "*.so" -exec ldd {} \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: TMP-Networks-Browser-Mini-Linux-Executable
          path: dist/TMP-Networks-Browser-Mini
          if-no-files-found: warn
